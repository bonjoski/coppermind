replicaCount: 2

image:
  repository: ghcr.io/bonjoski/coppermind
  pullPolicy: IfNotPresent
  tag: "v0.1.0"

profile: cluster

postgres:
  url: "postgres://coppermind:sovereign_secret@postgres-service:5432/coppermind?sslmode=disable"
  dimension: 128

redis:
  addr: "redis-service:6379"

rabbitmq:
  url: "amqp://guest:guest@rabbitmq-service:5672/"

service:
  type: ClusterIP
  port: 8765

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []
affinity: {}
