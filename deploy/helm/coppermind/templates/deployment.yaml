apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-coppermind
  labels:
    app.kubernetes.io/name: coppermind
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: coppermind
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coppermind
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: coppermind
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/coppermind"]
          args: ["daemon", "--listen", "0.0.0.0:8765"]
          env:
            - name: COPPERMIND_PROFILE
              value: "{{ .Values.profile }}"
            - name: COPPERMIND_POSTGRES_URL
              value: "{{ .Values.postgres.url }}"
            - name: COPPERMIND_REDIS_ADDR
              value: "{{ .Values.redis.addr }}"
            - name: COPPERMIND_RABBITMQ_URL
              value: "{{ .Values.rabbitmq.url }}"
          ports:
            - name: mcp-tcp
              containerPort: 8765
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
